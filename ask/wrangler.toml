name = "devbox-ask"
main = "src/index.ts"
compatibility_date = "2025-09-06"

# Workers Logs — 保留近期呼叫的 console 記錄,供事後查問答/SSE 問題。
[observability]
enabled = true
head_sampling_rate = 1

# 回答模型 Claude Haiku 每日呼叫上限(超過/出錯自動退回 llama);"0"=強制備援。
# 注意:全域 DAILY_CAP=250 會先擋,所以實際有效上限 = min(此值, 250)。
# secret ANTHROPIC_API_KEY 另設:wrangler secret put ANTHROPIC_API_KEY < ~/.config/anthropic/api_key
[vars]
HAIKU_DAILY_CAP = "300"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "resume"

[[kv_namespaces]]
binding = "ASK_KV"
id = "53c0380e24f649b9ac940f3d1bd29eac"

# 問答記錄(D1):每次問答存 question/answer/country/lang/ts(不存 IP)。
# 沿用 devbox D1,新建 ask_log 表。ADMIN_KEY(secret)保護 /admin 查看頁。
[[d1_databases]]
binding = "DB"
database_name = "devbox"
database_id = "fe0a2a4d-e1f5-4365-b9ac-90774d68dfe1"

# 速率護欄(原生 Rate Limiting,原子):per-IP 6/分、全域 40/分。
[[ratelimits]]
name = "RL_ASK_IP"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "RL_ASK_GLOBAL"
namespace_id = "1002"
simple = { limit = 40, period = 60 }
